name: Vérifier HELM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/frontend/package-lock.json
      - name: Installer PyTorch CPU
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Installer les outils et dépendances
        run: python -m pip install -c requirements/constraints-py312.txt ".[text,ui,ig,anchors,notebook,dev]"
      - name: Vérifier Python
        run: |
          python -m ruff check implementation_v2/helm interface/tests tools
          python -m pytest
      - name: Construire le package avec l’interface
        run: python tools/build_release.py
      - name: Vérifier JavaScript et métadonnées
        run: |
          npm test --prefix interface/frontend
          python -m twine check dist/*whl dist/*tar.gz
      - name: Installer et essayer la wheel hors sources
        run: |
          python -m pip install --force-reinstall --no-deps dist/*whl
          python -I tools/smoke_installed.py
      - name: Installation UI vierge et reconstruction du sdist
        run: |
          python -m venv /tmp/helm-ui-clean
          /tmp/helm-ui-clean/bin/python -m pip install "$(ls dist/*whl)[ui]" httpx pytest
          /tmp/helm-ui-clean/bin/python -I tools/smoke_installed.py
          /tmp/helm-ui-clean/bin/python -m pytest implementation_v2/tests/test_verified_ig.py
          mkdir /tmp/helm-source
          tar -xzf dist/*tar.gz -C /tmp/helm-source
          python -m build --wheel --outdir /tmp/helm-rebuilt /tmp/helm-source/*
      - uses: actions/upload-artifact@v4
        with:
          name: helm-distributions
          path: dist/

  ui-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[ui]" httpx
      - run: python -I tools/smoke_installed.py
